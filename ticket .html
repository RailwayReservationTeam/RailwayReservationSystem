<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Reservation Ticket</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="ticket.css">
</head>

<body>

    <div class="ticket">

        <h2>RAILWAY RESERVATION TICKET</h2>

        <div class="ticket-details">
            <p><strong>Passenger Name:</strong> Passenger Name</p>
            <p><strong>PNR Number:</strong> 1234567890</p>
            <p><strong>Train Name:</strong> Express Train</p>
            <p><strong>Train Number:</strong> 12345</p>
            <p><strong>From:</strong> Source Station</p>
            <p><strong>To:</strong> Destination Station</p>
            <p><strong>Coach:</strong> A1</p>
            <p><strong>Seat Number:</strong> 12</p>
        </div>

        <button class="print-button" onclick="window.print()">
            Print Ticket
        </button>

    </div>

</body>
</html>
